<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The favicon shown in the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Makes the page look good on mobile screens too -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Middleware Tutorial</title>
  </head>
  <body>
    <!--
      This <div> is the "mount point" for our React app.
      React will inject all its HTML inside this div.
      Without it, React has nowhere to live on the page.
    -->
    <div id="root"></div>

    <!--
      This <script> tag loads our React application.
      type="module" tells the browser this is modern JavaScript (ES Modules).
      Vite will process src/main.tsx and make it available here.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
